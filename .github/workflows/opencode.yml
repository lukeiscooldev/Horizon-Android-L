name: OpenCode Assistant (OpenRouter)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  opencode:
    # Restrict to lukeiscooldev AND check for /oc or /opencode slash commands
    if: >
      github.actor == 'lukeiscooldev' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenCode Action
        uses: anomalyco/opencode/github@dev
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/openrouter/free
