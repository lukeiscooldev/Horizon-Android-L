
name: Android CI

on:
  push:
    branches:
      - android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Horizon Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android
          components: clippy,rustfmt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check toolchain
        run: |
          python --version
          java -version
          rustc --version
          cargo --version
          gradle --version
          sdkmanager --list_installed

      - name: Prepare Horizon engine
        run: python tools/android_prepare.py

      - name: Build public ARM64 APK
        run: |
          python tools/android_build.py \
            --abi arm64-v8a \
            --public \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME" \
            --gradle "$(command -v gradle)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Android-${{ github.sha }}
          path: .local/android/apk/arm64-v8a/horizon-android-public.apk
          if-no-files-found: error
          retention-days: 14
